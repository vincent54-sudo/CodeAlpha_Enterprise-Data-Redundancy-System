<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Console | Enterprise Data Redundancy System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-950 p-3 text-gray-100 sm:p-5 md:p-8">
    <main class="mx-auto max-w-6xl space-y-5 sm:space-y-6">
        <header class="flex flex-wrap items-center justify-between gap-4 border-b border-gray-800 pb-5">
            <div>
                <p class="text-xs font-semibold uppercase tracking-widest text-rose-400">System administration</p>
                <h1 class="mt-1 text-2xl font-bold text-white">Admin console</h1>
                <p id="adminIdentity" class="mt-1 text-sm text-gray-400"></p>
            </div>
            <div class="flex w-full items-center gap-2 sm:w-auto sm:gap-3">
                <button onclick="loadOverview()" class="rounded-md border border-gray-700 px-3 py-2 text-sm text-gray-300 hover:border-blue-500 hover:text-white">Refresh</button>
                <button onclick="signOut()" class="rounded-md bg-gray-800 px-3 py-2 text-sm text-gray-200 hover:bg-gray-700">Sign out</button>
            </div>
        </header>

        <div id="adminError" class="hidden rounded-md border border-rose-800 bg-rose-950/50 px-4 py-3 text-sm text-rose-300" role="alert"></div>

        <section class="grid grid-cols-1 gap-3 sm:grid-cols-3" aria-label="System totals">
            <div class="border-l-2 border-blue-500 bg-gray-900 px-4 py-3"><p class="text-xs uppercase text-gray-500">Accounts</p><p id="userCount" class="mt-1 text-2xl font-bold">0</p></div>
            <div class="border-l-2 border-emerald-500 bg-gray-900 px-4 py-3"><p class="text-xs uppercase text-gray-500">Client accounts</p><p id="clientCount" class="mt-1 text-2xl font-bold">0</p></div>
            <div class="border-l-2 border-amber-500 bg-gray-900 px-4 py-3"><p class="text-xs uppercase text-gray-500">Cleanup jobs</p><p id="jobCount" class="mt-1 text-2xl font-bold">0</p></div>
        </section>

        <section class="space-y-3">
            <div class="flex items-end justify-between gap-3"><div><h2 class="text-lg font-semibold">Accounts</h2><p class="text-xs text-gray-500">Roles are assigned by the server, not during public registration.</p></div></div>
            <div class="overflow-x-auto border-y border-gray-800">
                <table class="w-full min-w-[620px] text-left text-sm">
                    <thead class="bg-gray-900 text-xs uppercase text-gray-400"><tr><th class="p-3">Name</th><th class="p-3">Email</th><th class="p-3">Role</th><th class="p-3">Created</th></tr></thead>
                    <tbody id="usersBody" class="divide-y divide-gray-800"></tbody>
                </table>
            </div>
        </section>

        <section class="space-y-3">
            <div><h2 class="text-lg font-semibold">Dataset audit history</h2><p class="text-xs text-gray-500">Latest system-wide cleanup jobs</p></div>
            <div class="overflow-x-auto border-y border-gray-800">
                <table class="w-full min-w-[900px] text-left text-sm">
                    <thead class="bg-gray-900 text-xs uppercase text-gray-400"><tr><th class="p-3">Job</th><th class="p-3">Client</th><th class="p-3">Dataset</th><th class="p-3">Date</th><th class="p-3">Rows</th><th class="p-3">Removed</th><th class="p-3">Redundancy</th><th class="p-3">Health</th></tr></thead>
                    <tbody id="jobsBody" class="divide-y divide-gray-800"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        function authHeaders() {
            return { Authorization: `Bearer ${sessionStorage.getItem('access_token') || ''}` };
        }

        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[character]);
        }

        async function signOut() {
            await fetch('/auth/logout', { method: 'POST', headers: authHeaders() });
            sessionStorage.removeItem('access_token');
            window.location.replace('/');
        }

        async function initializeAdmin() {
            if (!sessionStorage.getItem('access_token')) {
                window.location.replace('/');
                return;
            }
            const response = await fetch('/auth/me', { headers: authHeaders() });
            if (!response.ok) {
                sessionStorage.removeItem('access_token');
                window.location.replace('/');
                return;
            }
            const user = await response.json();
            if (user.role !== 'admin') {
                window.location.replace('/client');
                return;
            }
            document.getElementById('adminIdentity').textContent = `${user.full_name} · ${user.email}`;
            loadOverview();
        }

        async function loadOverview() {
            const response = await fetch('/admin/overview', { headers: authHeaders() });
            if (!response.ok) {
                document.getElementById('adminError').textContent = 'Could not load the admin overview.';
                document.getElementById('adminError').classList.remove('hidden');
                return;
            }
            const data = await response.json();
            const clients = data.users.filter(user => user.role === 'client').length;
            document.getElementById('userCount').textContent = data.users.length;
            document.getElementById('clientCount').textContent = clients;
            document.getElementById('jobCount').textContent = data.jobs.length;
            document.getElementById('usersBody').innerHTML = data.users.map(user => `
                <tr>
                    <td class="p-3 font-medium">${escapeHTML(user.full_name)}</td>
                    <td class="p-3 text-gray-300">${escapeHTML(user.email)}</td>
                    <td class="p-3"><span class="rounded border border-gray-700 px-2 py-1 text-xs ${user.role === 'admin' ? 'text-rose-300' : 'text-blue-300'}">${escapeHTML(user.role)}</span></td>
                    <td class="p-3 text-gray-400">${escapeHTML(user.created_at)}</td>
                </tr>`).join('') || '<tr><td colspan="4" class="p-4 text-gray-500">No accounts found.</td></tr>';
            document.getElementById('jobsBody').innerHTML = data.jobs.map(job => `
                <tr>
                    <td class="p-3 text-gray-500">#${job.id}</td>
                    <td class="p-3 text-gray-300">${escapeHTML(job.user_email || 'Legacy record')}</td>
                    <td class="p-3 font-medium">${escapeHTML(job.filename)}</td>
                    <td class="p-3 text-gray-400">${escapeHTML(job.timestamp)}</td>
                    <td class="p-3">${job.original_rows} → ${job.cleaned_rows}</td>
                    <td class="p-3 text-amber-300">${job.duplicates_removed}</td>
                    <td class="p-3">${job.redundancy_percentage}%</td>
                    <td class="p-3">${job.health_score == null ? 'N/A' : `${job.health_score}/100`}</td>
                </tr>`).join('') || '<tr><td colspan="8" class="p-4 text-gray-500">No cleanup jobs recorded.</td></tr>';
        }

        initializeAdmin();
    </script>
</body>
</html>
